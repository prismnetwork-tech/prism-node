name: Node defect
description: Report reproducible incorrect node behavior.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include keys and credentials here.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized commands and preflight output.
    validations:
      required: true
