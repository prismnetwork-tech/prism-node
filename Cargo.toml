[package]
name = "prismd"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Prism Network GPU supplier node daemon"
homepage = "https://prismnetwork.tech"
repository = "https://github.com/prismnetwork-tech/prism-node"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "serde"] }
hex = "0.4.3"
prism-protocol = { git = "https://github.com/prismnetwork-tech/prism-protocol", tag = "v0.1.0" }
rand = "0.8.5"
rcgen = { version = "0.14.8", features = ["pem", "x509-parser"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustls = "0.23.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["serde", "v7"] }

[profile.release]
lto = "thin"
strip = "symbols"
